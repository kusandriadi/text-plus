name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.version.outputs.release }}
      next: ${{ steps.version.outputs.next }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [[ ! "$VERSION" == *-SNAPSHOT ]]; then
            echo "Not a snapshot version: $VERSION"
            exit 0
          fi
          RELEASE_VERSION=${VERSION%-SNAPSHOT}
          echo "release=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$RELEASE_VERSION"
          NEXT_PATCH=$((PATCH + 1))
          echo "next=${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        if: steps.version.outputs.release != ''
        run: |
          if git rev-parse "v${{ steps.version.outputs.release }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: bun install

      - name: Set version in tauri.conf.json
        run: |
          VERSION="${{ needs.prepare.outputs.release }}"
          cd src-tauri
          sed -i '' "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" tauri.conf.json

      - name: Run tests
        run: bun run test

      - name: Build (Apple Silicon)
        run: bunx tauri build --target aarch64-apple-darwin

      - name: Rename DMG
        run: |
          VERSION="${{ needs.prepare.outputs.release }}"
          mv src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
             src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/text-plus_${VERSION}.dmg

      - name: Compute SHA256
        id: sha
        run: |
          VERSION="${{ needs.prepare.outputs.release }}"
          SHA=$(shasum -a 256 src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/text-plus_${VERSION}.dmg | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "DMG SHA256: $SHA"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/text-plus_*.dmg

      - name: Save SHA256
        run: echo "${{ steps.sha.outputs.sha256 }}" > /tmp/sha256.txt

      - name: Upload SHA256
        uses: actions/upload-artifact@v4
        with:
          name: sha256
          path: /tmp/sha256.txt

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts

      - name: Download SHA256
        uses: actions/download-artifact@v4
        with:
          name: sha256
          path: .

      - name: Read SHA256
        id: sha
        run: echo "sha256=$(cat sha256.txt)" >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.prepare.outputs.release }}" -m "Release v${{ needs.prepare.outputs.release }}"
          git push origin "v${{ needs.prepare.outputs.release }}"

      - name: Create GitHub Release
        run: |
          RELEASE_VERSION="${{ needs.prepare.outputs.release }}"
          gh release create "v${RELEASE_VERSION}" \
            --title "v${RELEASE_VERSION}" \
            --generate-notes \
            artifacts/*.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask
        run: |
          VERSION="${{ needs.prepare.outputs.release }}"
          SHA="${{ steps.sha.outputs.sha256 }}"

          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/kusandriadi/homebrew-tap.git
          cd homebrew-tap

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cat > Casks/text-plus.rb << CASKEOF
          cask "text-plus" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/kusandriadi/text-plus/releases/download/v#{version}/text-plus_#{version}.dmg"
            name "Text Plus"
            desc "Lightweight code editor for macOS — Notepad++ alternative"
            homepage "https://github.com/kusandriadi/text-plus"

            depends_on macos: ">= :catalina"
            depends_on arch: :arm64

            app "text-plus.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/text-plus.app"]
            end

            zap trash: [
              "~/Library/Preferences/com.textplus.editor.plist",
              "~/Library/Saved Application State/com.textplus.editor.savedState",
            ]
          end
          CASKEOF

          git add Casks/text-plus.rb
          git commit -m "Update text-plus to v${VERSION} (sha256: ${SHA})" || exit 0
          git push

      - name: Bump to next snapshot version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEXT_VERSION="${{ needs.prepare.outputs.next }}"
          echo "$NEXT_VERSION" > VERSION
          git add VERSION
          git commit -m "Bump version to ${NEXT_VERSION}"
          git push origin master
