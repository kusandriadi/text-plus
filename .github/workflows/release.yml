name: Release

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read VERSION
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [[ ! "$VERSION" == *-SNAPSHOT ]]; then
            echo "VERSION file does not contain a SNAPSHOT version: $VERSION"
            exit 0
          fi
          RELEASE_VERSION=${VERSION%-SNAPSHOT}
          echo "snapshot=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

          # Calculate next patch version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RELEASE_VERSION"
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          echo "next=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        if: steps.version.outputs.release != ''
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.release }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        if: steps.version.outputs.release != '' && steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          RELEASE_VERSION="${{ steps.version.outputs.release }}"

          # Create and push tag
          git tag -a "v${RELEASE_VERSION}" -m "Release v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"

          # Create GitHub release
          gh release create "v${RELEASE_VERSION}" \
            --title "v${RELEASE_VERSION}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump to next snapshot version
        if: steps.version.outputs.release != '' && steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          NEXT_VERSION="${{ steps.version.outputs.next }}"

          echo "$NEXT_VERSION" > VERSION
          git add VERSION
          git commit -m "Bump version to ${NEXT_VERSION}"
          git push origin master
